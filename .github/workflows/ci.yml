name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno task fmt --check

      - name: Lint
        run: deno task lint

      - name: Type check all public seams
        run: deno task check

      - name: Unit tests
        run: deno task test:unit

      - name: Integration tests
        run: deno task test:integration

      - name: Performance contract tests
        run: deno task test:performance

      - name: Coverage gate
        run: deno task coverage

      - name: Bench smoke
        run: deno task bench

      - name: JSR publish dry-run
        run: deno publish --dry-run
